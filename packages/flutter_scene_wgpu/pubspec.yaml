name: flutter_scene_wgpu
description: wgpu GPU backend for flutter_scene's GPU shim. A Rust crate behind a synchronous, handle-based C ABI, reached through FFI.
publish_to: none
version: 0.0.1

resolution: workspace

environment:
  sdk: ^3.10.0
  flutter: ">=3.29.0-1.0.pre.242"

dependencies:
  code_assets: '>=1.2.0 <3.0.0'
  ffi: ^2.1.0
  flutter:
    sdk: flutter
  flutter_gpu:
    sdk: flutter
  hooks: ^2.0.0

dev_dependencies:
  flutter_lints: ^5.0.0
  flutter_test:
    sdk: flutter

# The plugin registers the external textures the presenter renders into
# (lib/src/present). The native library itself is a code asset built by
# hook/build.dart.
flutter:
  plugin:
    platforms:
      android:
        package: dev.fscene.flutter_scene_wgpu
        pluginClass: FlutterSceneWgpuPlugin
      ios:
        pluginClass: FlutterSceneWgpuPlugin
      macos:
        pluginClass: FlutterSceneWgpuPlugin
