name: flutter_scene_wgpu_example
description: A rotating lit cube drawn by wgpu and presented through a Flutter texture.
publish_to: none
version: 1.0.0+1

resolution: workspace

environment:
  sdk: ^3.10.0

dependencies:
  flutter:
    sdk: flutter
  flutter_scene:
    path: ../../flutter_scene
  flutter_scene_wgpu:
    path: ..
  vector_math: ^2.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
