[package]
name = "shader_probe"
version = "0.0.1"
edition = "2021"
publish = false
description = "Loads flutter_gpu shader bundles into naga and a headless wgpu device and reports which shaders load."

[workspace]

[dependencies]
wgpu = { version = "30.0.1", features = ["naga-ir", "spirv", "glsl", "wgsl"] }
naga = { version = "30.0.1", features = ["spv-in", "glsl-in", "wgsl-in", "wgsl-out", "msl-out"] }
pollster = "0.4"
serde_json = "1"
