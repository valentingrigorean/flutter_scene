[package]
name = "flutter_scene_wgpu_native"
version = "0.0.1"
edition = "2021"
publish = false
description = "Native side of the flutter_scene_wgpu Flutter package. Wraps wgpu behind a synchronous, handle-based C ABI."

[lib]
name = "flutter_scene_wgpu_native"
crate-type = ["staticlib", "cdylib"]

[dependencies]
pollster = "0.4"
wgpu = { version = "30.0.1", features = ["spirv", "naga-ir"] }

[profile.release]
lto = true
codegen-units = 1

# Presentation into a Flutter external texture (src/present).
[dependencies.bytemuck]
version = "1"
features = ["derive"]

[target.'cfg(target_vendor = "apple")'.dependencies]
objc2 = "0.6"
objc2-io-surface = { version = "0.3.2", default-features = false, features = ["std", "IOSurfaceRef"] }
objc2-metal = { version = "0.3.2", default-features = false, features = ["std", "MTLDevice", "MTLTexture", "MTLAllocation", "MTLResource", "MTLPixelFormat", "MTLTypes", "objc2-io-surface"] }

[target.'cfg(target_os = "android")'.dependencies]
raw-window-handle = "0.6"
